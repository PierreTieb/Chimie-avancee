<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chimie avancée</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body>
<section id="home" class="screen active">
<h1 class="app-title">Chimie avancée</h1>
<p class="app-subtitle">Quelques notions en vrac pour travailler en autonomie</p>
<div class="mode-list">
<button class="mode-btn mode-btn--violet" data-go="redox"><span class="mode-btn__title">Réaction d'oxydoréduction</span><span class="mode-btn__subtitle">Demi-équations et équations bilan</span></button>
<button class="mode-btn mode-btn--orange" disabled><span class="mode-btn__title">Réaction acido-basique</span><span class="mode-btn__subtitle">Bientôt</span></button>
</div></section>

<section id="redox" class="screen">
<button class="btn-back" data-go="home">← Retour</button>
<h1 class="app-title">Réaction d'oxydoréduction</h1>
<p class="app-subtitle">Choisis ton mode pour commencer</p>
<div class="mode-list">
<button class="mode-btn mode-btn--pale" id="go-bilan"><span class="mode-btn__title">Équations bilan</span><span class="mode-btn__subtitle">Équilibre une réaction étape par étape</span></button>
<button class="mode-btn mode-btn--grey" disabled><span class="mode-btn__title">Prochainement</span><span class="mode-btn__subtitle">Laboratoire</span></button>
</div></section>

<section id="work" class="screen screen--wide">
<div class="topbar"><button class="btn-back" data-go="redox">← Retour</button><button class="btn-secondary" id="b-tuto">Tuto</button></div>
<p class="goal" id="goal"></p>
<div class="cpl" id="cpl"></div>
<div class="topbar tools" id="tools"><button class="btn-secondary" id="b-couples">Voir les couples</button><button class="btn-secondary" id="b-choose">Choisir une réaction</button></div>
<div class="ref" id="ref"></div>
<div class="eq" id="eq"></div>
<div id="tbl" class="cnt"></div>
<p class="ex-feedback" id="fb"></p>
<div class="ex-actions"><button class="btn-primary" id="b-ok">Valider</button><button class="btn-primary" id="b-next" style="display:none">Nouvelle réaction</button></div>
</section>

<div class="overlay" id="ov"><div class="panel"><h2 id="ov-t"></h2><div id="ov-b"></div><button class="btn-primary" id="ov-x">Fermer</button></div></div>
<div class="rotate" id="rot"><div>📱↻<p>Passe en mode paysage pour travailler plus confortablement</p></div></div>
<canvas id="confetti-canvas"></canvas>
<script src="js/confetti.js"></script>
<script src="js/redox.js"></script>
</body></html>
